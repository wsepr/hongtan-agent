name: Release standalone Agent runtime

# 推 v* tag 触发：verify → 3 平台 bun compile + 冒烟 → sha256sum → 生成清单 → GitHub Release
# 产物：hongtan-agent-<platform>-<arch>[.exe] + checksums.txt + runtime.manifest.json
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify source and release version
        shell: bash
        run: |
          npm run check
          # 允许预发布后缀（v0.1.0-test.1 ↔ 0.1.0），与 softprops 的 prerelease 判定同口径
          version="$(node -p "require('./package.json').version")"
          case "$GITHUB_REF_NAME" in
            "v${version}"|"v${version}"-*) ;;
            *) echo "tag ${GITHUB_REF_NAME} 与 package.json 版本 ${version} 不匹配" >&2; exit 1 ;;
          esac

  build-and-smoke:
    needs: verify-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: bun-darwin-arm64
            asset: hongtan-agent-darwin-arm64
          - runner: ubuntu-24.04
            target: bun-linux-x64-baseline
            asset: hongtan-agent-linux-x64
          - runner: windows-2025
            target: bun-windows-x64-baseline
            asset: hongtan-agent-win32-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun baseline runtime for Windows x64
        if: ${{ matrix.target == 'bun-windows-x64-baseline' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.13/bun-windows-x64-baseline.zip

      - name: Set up Bun
        if: ${{ matrix.target != 'bun-windows-x64-baseline' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Build standalone runtime
        shell: bash
        run: |
          mkdir -p dist
          target_flag="--target=${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "bun-windows-x64-baseline" ]; then
            # 已直装 baseline 运行时，原生编译内嵌即可，避免 Bun 经 target 拉取重复下载
            target_flag=""
          fi
          for attempt in 1 2 3; do
            if bun build --compile $target_flag plugins/hongtan-agent/scripts/runtime-entry.mjs --outfile dist/${{ matrix.asset }}; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Standalone runtime build failed after $attempt attempts." >&2
              exit 1
            fi
            echo "Standalone runtime build attempt $attempt failed; retrying transient target download." >&2
            sleep $((attempt * 5))
          done

      - name: Smoke test standalone runtime
        run: node tests/standalone-runtime-smoke.mjs dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build-and-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum hongtan-agent-* > checksums.txt

      - name: Create platform runtime manifest
        run: node scripts/create-runtime-manifest.mjs dist/runtime.manifest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/hongtan-agent-*
            dist/checksums.txt
            dist/runtime.manifest.json
